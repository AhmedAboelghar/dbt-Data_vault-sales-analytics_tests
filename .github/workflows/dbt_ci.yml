name: dbt Continuous Integration (Quality Gates)

on:
  pull_request:
    branches:
      - main

jobs:
  run-quality-gates:
    name: Run dbt CI Pipeline
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dbt-postgres
        run: pip install dbt-postgres

      - name: Setup dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          my_postgres_project:
            target: ci
            outputs:
              ci:
                type: postgres
                host: localhost
                user: ci_user
                password: ci_password
                port: 5432
                dbname: ci_db
                schema: ci_schema
                threads: 4
          EOF

      - name: Install dbt Packages
        run: dbt deps --target ci

      - name: Run dbt Seed
        run: dbt seed --target ci

      - name: Create Mock Tables with Exact Columns
        run: |
          PGPASSWORD=ci_password psql -h localhost -U ci_user -d ci_db -c "
            CREATE TABLE IF NOT EXISTS public.fact_orders (
                \"Row ID\" INT,
                \"Order ID\" VARCHAR(50),
                \"Customer ID\" VARCHAR(50),
                \"Product ID\" VARCHAR(50),
                \"Customer_Key\" VARCHAR(50),
                \"Product_Key\" INT
            );
            INSERT INTO public.fact_orders (\"Row ID\", \"Order ID\", \"Customer ID\", \"Product ID\", \"Customer_Key\", \"Product_Key\") 
            VALUES (1, 'ORD-1', 'CUST-1', 'PROD-1', 'CK-1', 1), (2, 'ORD-2', 'CUST-2', 'PROD-2', 'CK-2', 2);

            CREATE TABLE IF NOT EXISTS public.\"DIM_Customer\" (
                \"Customer ID\" VARCHAR(50),
                \"Customer_Key\" VARCHAR(50)
            );
            INSERT INTO public.\"DIM_Customer\" (\"Customer ID\", \"Customer_Key\") 
            VALUES ('CUST-1', 'CK-1'), ('CUST-2', 'CK-2');
          "

      - name: Compile dbt Models
        run: dbt compile --target ci

      - name: Run dbt Models
        run: dbt run --target ci

      - name: Run Data Quality Tests
        run: dbt test --target ci