name: dbt Continuous Integration (Quality Gates)

on:
  pull_request:
    branches:
      - main

jobs:
  run-quality-gates:
    name: Run dbt CI Pipeline
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dbt-postgres
        run: pip install dbt-postgres

      - name: Setup dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          my_postgres_project:
            target: ci
            outputs:
              ci:
                type: postgres
                host: localhost
                user: ci_user
                password: ci_password
                port: 5432
                dbname: ci_db
                schema: ci_schema
                threads: 4
          EOF

      - name: Install dbt Packages
        run: dbt deps --target ci

      # 1. خطوة تحميل الـ Seeds (الـ city و customer الموجودين عندك)
      - name: Run dbt Seed
        run: dbt seed --target ci

      # 2. خطوة إنشاء الـ Mock لجدول fact_orders عشان المشكلة تخلص فوري بدون ملفات كبيرة
      - name: Create Mock fact_orders Table
        run: |
          PGPASSWORD=ci_password psql -h localhost -U ci_user -d ci_db -c "
            CREATE TABLE IF NOT EXISTS public.fact_orders (
                order_id INT,
                customer_id INT,
                order_date TIMESTAMP
            );
            INSERT INTO public.fact_orders (order_id, customer_id, order_date) 
            VALUES (1, 101, NOW()), (2, 102, NOW());
          "

      - name: Compile dbt Models
        run: dbt compile --target ci

      - name: Run dbt Models
        run: dbt run --target ci

      - name: Run Data Quality Tests
        run: dbt test --target ci