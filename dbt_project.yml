name: 'my_postgres_project'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'my_postgres_project'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Configuring models
models:
  my_postgres_project:
    vault:
      +materialized: table
    example:
      +materialized: view

vars:
  elementary:
    database: postgres
    schema: elementary