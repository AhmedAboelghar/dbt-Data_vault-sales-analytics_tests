version: 2

models:
  # 1. Customer Hub
  - name: hub_customer
    columns:
      - name: hk_customer
        tests: [unique, not_null]
      - name: customer_id
        tests: [unique, not_null]

  # 2. Order Hub
  - name: hub_orders
    columns:
      - name: hk_order
        tests: [unique, not_null]
      - name: order_id
        tests: [unique, not_null]

  # 4. Link Order-Customer
  - name: link_order_customer
    columns:
      - name: hk_link_order_customer
        tests: [unique, not_null]
      
      - name: hk_order
        tests:
          - not_null
          - relationships:
              to: ref('hub_orders')
              field: hk_order

      - name: hk_customer
        tests:
          - not_null
          - relationships:
              to: ref('hub_customer')
              field: hk_customer

  # 5. Customer Satellite 
  - name: sat_customer
    columns:
      - name: hk_customer
        tests:
          - not_null
          - relationships:
              to: ref('hub_customer')
              field: hk_customer

      - name: hash_diff
        tests: [not_null]

      - name: customer_name
        tests: [not_null]